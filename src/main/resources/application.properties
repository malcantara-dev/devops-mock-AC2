spring.application.name=teste-unidade-2

# Persistência (Prática 3): H2 em memória para dev/teste.
# Em produção: sobrescrever SPRING_DATASOURCE_URL/USERNAME/PASSWORD (MySQL/Postgres) por variável de ambiente.
spring.jpa.open-in-view=false

# Observabilidade (Prática 4): Actuator + Micrometer -> Prometheus -> Grafana
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
